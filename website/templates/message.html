<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UM MODE OFF</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0; min-height: 100vh; background: #0a0a0a; color: #f0f0f0;
    font-family: 'Share Tech Mono', monospace;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    max-width: 420px; text-align: center;
    background: #141414; border: 1px solid #262626; border-radius: 4px;
    padding: 36px 28px;
    box-shadow: 0 0 0 1px rgba(224,38,63,0.15), 0 20px 60px rgba(0,0,0,0.5);
  }
  h1 { font-family: 'Orbitron', sans-serif; font-size: 16px; color: #e0263f; letter-spacing: 1px; }
  p { color: #8a8a8a; font-size: 13px; line-height: 1.6; }
  a { color: #e0263f; }
</style>
</head>
<body>
  <div class="card">
    <h1>{{ title }}</h1>
    <p>{{ text }}</p>
    <p><a href="/">← Wapas jaao</a></p>
  </div>
</body>
</html>
